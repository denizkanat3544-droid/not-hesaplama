<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<title>Uni Not Hesaplama</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1b2a41;--mute:#5d6b7e;--line:#d9d2c3;--accent:#1b2a41;--onaccent:#fffdf8;--ok:#1f7a4d;--bad:#b3362f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a26;--card:#1b2636;--ink:#eae6dc;--mute:#9aa7b8;--line:#2f3d52;--accent:#e8c872;--onaccent:#121a26;--ok:#5fcf97;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#121a26;--card:#1b2636;--ink:#eae6dc;--mute:#9aa7b8;--line:#2f3d52;--accent:#e8c872;--onaccent:#121a26;--ok:#5fcf97;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 0 20px;font-size:.95rem}
button{font:inherit;cursor:pointer}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
label{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:6px}
label span{color:var(--mute);font-size:.85rem}
input{width:100%;font:inherit;font-size:1.4rem;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field+.field{margin-top:16px}
#go{width:100%;margin-top:20px;padding:14px;background:var(--accent);color:var(--onaccent);border:0;border-radius:4px;font-size:1.05rem;font-weight:bold}
#err{color:var(--bad);margin:12px 0 0;min-height:1.2em;font-size:.9rem}
#res{margin-top:20px;display:none}
.avg{font-size:3.4rem;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.verdict{font-size:1.15rem;font-weight:bold;margin:8px 0 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.note{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);line-height:1.5}
.note b{font-size:1.2rem}
footer{margin-top:24px;color:var(--mute);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
<header><h1>Uni Not Hesaplama</h1><button id="theme" type="button">🌙 Koyu</button></header>
<p class="sub">Vize %40 · Final %60 · Geçme notu 60</p>
<div class="card">
<div class="field"><label for="vize">Vize notu <span>0–100</span></label><input id="vize" type="number" inputmode="decimal" min="0" max="100" step="any"></div>
<div class="field"><label for="final">Final notu <span>0–100</span></label><input id="final" type="number" inputmode="decimal" min="0" max="100" step="any"></div>
<button id="go" type="button">Hesapla</button>
<p id="err" role="alert"></p>
</div>
<div id="res" class="card" aria-live="polite">
<p class="sub" style="margin:0 0 6px">Ortalama</p>
<p class="avg" id="avg"></p>
<p class="verdict" id="verdict"></p>
<div class="note" id="note"></div>
</div>
<footer>Hunterx'in Windows uygulamasından uyarlanmıştır</footer>
</main>
<script>
var W_V=0.4,W_F=0.6,PASS=60,W_B=0.6;
var $=function(i){return document.getElementById(i)};
var root=document.documentElement;
function setTheme(t){root.setAttribute("data-theme",t);$("theme").textContent=t==="dark"?"☀️ Açık":"🌙 Koyu";
document.querySelector('meta[name=theme-color]').content=t==="dark"?"#121a26":"#f3efe6";
try{localStorage.setItem("theme",t)}catch(e){}}
var saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=function(){setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark")};
function fmt(n){return (Math.round(n*100)/100).toString().replace(".",",")}
function calc(){
var v=parseFloat($("vize").value.replace(",",".")),f=parseFloat($("final").value.replace(",","."));
$("err").textContent="";
if(isNaN(v)||isNaN(f)){$("err").textContent="Vize ve final notunu gir.";$("res").style.display="none";return}
if(v<0||v>100||f<0||f>100){$("err").textContent="Notlar 0 ile 100 arasında olmalı.";$("res").style.display="none";return}
var avg=v*W_V+f*W_F,pass=avg>=PASS;
$("res").style.display="block";
$("avg").textContent=fmt(avg);
var vd=$("verdict");vd.textContent=pass?"✓ GEÇTİNİZ":"✗ KALDINIZ";vd.className="verdict "+(pass?"ok":"bad");
var n=$("note");
if(pass){n.innerHTML="Bütünlemeye girmen gerekmiyor."}
else{
var need=(PASS-v*W_V)/W_B;
if(need>100){n.innerHTML="Bütünlemeden 100 alsan bile ortalaman "+fmt(v*W_V+100*W_B)+" olur. Bu vizeyle büt ile geçmek mümkün değil."}
else{n.innerHTML="Bütünlemede geçmek için en az <b>"+fmt(Math.max(need,0))+"</b> almalısın."}
}}
$("go").onclick=calc;
["vize","final"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")calc()})});
</script>
</body>
</html>
